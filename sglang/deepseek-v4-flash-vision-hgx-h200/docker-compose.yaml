name: deepseek-v4-flash-vision-h200
services:
  sglang:
    cap_add:
    - SYS_NICE
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            driver: nvidia
            count: 8
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      OMP_NUM_THREADS: '16'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      OTEL_SERVICE_NAME: sglang
      OTEL_TRACES_SAMPLER: parentbased_always_on
      SGLANG_DG_CACHE_DIR: /cache/deepgemm
      SGLANG_TRACE_LEVEL: '1'
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
      SGLANG_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      PYTHONHASHSEED: '0'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:30000/health',headers={'Authorization':'Bearer '+os.environ['SGLANG_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m
    image: lmsysorg/sglang:dev-dsv4-flash-vision@sha256:44a113290011bf87fcfeabc2ed94966bfc90f91b2dbe6239a69de3f35e686cba
    ipc: host
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 100m
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 2m0s
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
    - /opt/models/huggingface:/models
    - kernel-cache:/cache
    depends_on:
      otel-collector:
        condition: service_started
    entrypoint: >-
      python3 -m sglang.launch_server
      --model-path deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      --revision 6821d6ad3681a4b137b066b76094fa82ebd0a380
      --download-dir /models
      --served-model-name deepseek-v4-flash-vision
      --host 0.0.0.0
      --port 30000
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --admin-api-key '${SGLANG_ADMIN_API_KEY:?set SGLANG_ADMIN_API_KEY}'
      --trust-remote-code
      --tp-size 8
      --dp-size 8
      --enable-dp-attention
      --ep-size 1
      --moe-a2a-backend none
      --load-balance-method total_tokens
      --moe-runner-backend flashinfer_mxfp4
      --disable-shared-experts-fusion
      --context-length 200000
      --reasoning-parser deepseek-v4
      --tool-call-parser deepseekv4
      --kv-cache-dtype fp8_e4m3
      --page-size 256
      --chunked-prefill-size 32768
      --max-running-requests 256
      --max-queued-requests 64
      --cuda-graph-max-bs-decode 32
      --schedule-policy fcfs
      --mem-fraction-static 0.85
      --enable-metrics
      --enable-cache-report
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --default-chat-template-kwargs '{"thinking":true}'
    command: []
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://sglang:30000
      --backend sglang
      --dp-aware
      --policy cache_aware
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    ports:
    - 127.0.0.1:30001:30001
    depends_on:
      otel-collector:
        condition: service_started
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:?set external OTLP gRPC endpoint}
      OTLP_UPSTREAM_INSECURE: 'false'
      ENGINE_METRICS_TARGET: sglang:30000
      ENGINE_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      TELEMETRY_RECIPE: deepseek-v4-flash-vision-hgx-h200
      TELEMETRY_ENVIRONMENT: production
volumes:
  kernel-cache: null
