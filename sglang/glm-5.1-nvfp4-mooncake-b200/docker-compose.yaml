name: glm-5.1-nvfp4-mooncake-b200
services:
  sglang:
    cap_add:
    - SYS_NICE
    - IPC_LOCK
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            driver: nvidia
            count: all
    environment:
      OMP_NUM_THREADS: '32'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      OTEL_SERVICE_NAME: sglang
      OTEL_TRACES_SAMPLER: parentbased_always_on
      SGLANG_ADMIN_API_KEY: ${SGLANG_ADMIN_API_KEY:?set SGLANG_ADMIN_API_KEY}
      SGLANG_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      SGLANG_DG_CACHE_DIR: /cache/dg
      SGLANG_ENABLE_SPEC_V2: '1'
      SGLANG_TRACE_LEVEL: '1'
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
      PYTHONHASHSEED: '0'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:30000/health',headers={'Authorization':'Bearer '+os.environ['SGLANG_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m
    image: lmsysorg/sglang:v0.5.19@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    ipc: host
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 100m
    networks:
      mooncake_net: null
    platform: linux/amd64
    restart: unless-stopped
    security_opt:
    - seccomp:unconfined
    shm_size: '34359738368'
    stop_grace_period: 1m0s
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
    - /opt/models:/models
    - ./logs:/logs
    - ./cache/torchinductor:/cache/torchinductor
    - ./cache/triton:/cache/triton
    - ./cache/dg:/cache/dg
    depends_on:
      otel-collector:
        condition: service_started
    entrypoint: >-
      python3 -m sglang.launch_server
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --model-path /models/GLM-5.1-NVFP4
      --quantization modelopt_fp4
      --served-model-name glm
      --host 0.0.0.0
      --port 30000
      --admin-api-key '${SGLANG_ADMIN_API_KEY:?set SGLANG_ADMIN_API_KEY}'
      --attention-backend dsa
      --moe-runner-backend flashinfer_trtllm
      --flashinfer-allreduce-fusion-backend auto
      --context-length 202752
      --reasoning-parser glm45
      --tool-call-parser glm47
      --trust-remote-code
      --kv-cache-dtype fp8_e4m3
      --page-size 64
      --chunked-prefill-size 65536
      --max-prefill-tokens 32768
      --cuda-graph-max-bs 18
      --max-running-requests 128
      --enable-dp-attention
      --enable-dp-lm-head
      --load-balance-method total_tokens
      --schedule-policy lpm
      --mem-fraction-static 0.85
      --enable-metrics
      --enable-custom-logit-processor
      --enable-cache-report
      --model-loader-extra-config '{"enable_multithread_load":true,"num_threads":128}'
      --tp-size 8
      --dp-size 8
      --dsa-prefill-backend trtllm
      --dsa-decode-backend trtllm
      --default-chat-template-kwargs '{"enable_thinking":true}'
    command: []
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://sglang:30000
      --backend sglang
      --dp-aware
      --policy cache_aware
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    ports:
    - 127.0.0.1:30001:30001
    depends_on:
      otel-collector:
        condition: service_started
    networks:
    - mooncake_net
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:?set external OTLP gRPC endpoint}
      OTLP_UPSTREAM_INSECURE: 'false'
      ENGINE_METRICS_TARGET: sglang:30000
      ENGINE_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      TELEMETRY_RECIPE: glm-5.1-nvfp4-mooncake-b200
      TELEMETRY_ENVIRONMENT: production
    networks:
    - mooncake_net
networks:
  mooncake_net:
    driver: bridge
