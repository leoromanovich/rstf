name: qwen38-sglang-smg
services:
  sglang:
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            driver: nvidia
            device_ids:
            - '0'
    environment:
      HF_HUB_OFFLINE: '1'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      SGLANG_TRACE_LEVEL: '1'
      SGLANG_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      PYTHONHASHSEED: '0'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:30000/health',headers={'Authorization':'Bearer '+os.environ['SGLANG_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m
    image: lmsysorg/sglang:v0.5.19@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    init: true
    restart: unless-stopped
    shm_size: '17179869184'
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
    - /data/scratch/qwen38-sglang-smg/models/Qwen3.8-27B-FP8:/model:ro
    - /data/scratch/qwen38-sglang-smg/runtime-cache:/root/.cache
    depends_on:
      otel-collector:
        condition: service_started
    entrypoint: >-
      python3 -m sglang.launch_server
      --model-path /model
      --tokenizer-path /model
      --served-model-name Qwen3.8-27B
      --host 0.0.0.0
      --port 30000
      --tp-size 1
      --dp-size 1
      --enable-dp-attention
      --dtype bfloat16
      --kv-cache-dtype fp8_e4m3
      --context-length 32768
      --mem-fraction-static 0.94
      --max-running-requests 8
      --chunked-prefill-size 2048
      --page-size 64
      --mamba-ssm-dtype bfloat16
      --mamba-radix-cache-strategy extra_buffer_lazy
      --mamba-full-memory-ratio 1.1
      --max-mamba-cache-size 35
      --enable-metrics
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --otlp-traces-endpoint otel-collector:4317
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --enable-trace
      --speculative-algorithm EAGLE
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
      --enable-linear-replayssm-spec
      --default-chat-template-kwargs '{"enable_thinking":true,"reasoning_effort":"medium"}'
    command: []
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://sglang:30000
      --backend sglang
      --dp-aware
      --policy cache_aware
      --api-key '${SGLANG_API_KEY:?set SGLANG_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    ports:
    - 127.0.0.1:30001:30001
    depends_on:
      otel-collector:
        condition: service_started
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: jaeger:4317
      OTLP_UPSTREAM_INSECURE: 'true'
      ENGINE_METRICS_TARGET: sglang:30000
      ENGINE_API_KEY: ${SGLANG_API_KEY:?set SGLANG_API_KEY}
      TELEMETRY_RECIPE: qwen3.8-27b-fp8-hicache
      TELEMETRY_ENVIRONMENT: development
  jaeger:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: jaeger
  download:
    environment:
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      MODEL_DIR: /model
    image: lmsysorg/sglang:v0.5.19@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    restart: 'no'
    volumes:
    - /data/scratch/qwen38-sglang-smg/models/Qwen3.8-27B-FP8:/model
    - ./download.sh:/opt/qwen38/download.sh:ro
    profiles:
    - tools
    entrypoint:
    - bash
    - /opt/qwen38/download.sh
