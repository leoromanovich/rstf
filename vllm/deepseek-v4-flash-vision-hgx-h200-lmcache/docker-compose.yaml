name: deepseek-v4-vision-vllm-lmcache-h200
services:
  vllm:
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            driver: nvidia
            count: 8
    environment:
      DO_NOT_TRACK: '1'
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN:-}
      OMP_NUM_THREADS: '8'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      OTEL_SERVICE_NAME: vllm
      OTEL_TRACES_SAMPLER: parentbased_always_on
      PYTHONDONTWRITEBYTECODE: '1'
      TRITON_CACHE_DIR: /cache/triton
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      VLLM_CACHE_ROOT: /cache/vllm
      VLLM_NO_USAGE_STATS: '1'
      PYTHONHASHSEED: '0'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:30000/health',headers={'Authorization':'Bearer '+os.environ['VLLM_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m
    image: vllm/vllm-openai:deepseekv4-flash-vision@sha256:65f80b25dfb7b6a419fa8054a5da22a35bec798ef82e625354d1f708448c9b6c
    ipc: host
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 100m
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 2m0s
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    volumes:
    - /opt/models/huggingface:/models
    - kernel-cache:/cache
    - ./smoke.py:/opt/recipe/smoke.py:ro
    - ./acceptance.py:/opt/recipe/acceptance.py:ro
    depends_on:
      otel-collector:
        condition: service_started
    entrypoint: >-
      vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      --revision 6821d6ad3681a4b137b066b76094fa82ebd0a380
      --served-model-name deepseek-v4-flash-vision
      --host 0.0.0.0
      --port 30000
      --api-server-count 1
      --trust-remote-code
      --tensor-parallel-size 1
      --data-parallel-size 8
      --enable-expert-parallel
      --all2all-backend allgather_reducescatter
      --moe-backend marlin
      --max-model-len 400000
      --kv-cache-dtype fp8_ds_mla
      --block-size 256
      --enable-prefix-caching
      --no-disable-hybrid-kv-cache-manager
      --enable-chunked-prefill
      --disable-chunked-mm-input
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --max-num-queued-reqs 512
      --gpu-memory-utilization 0.88
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":32}'
      --tokenizer-mode deepseek_v4
      --reasoning-parser deepseek_v4
      --tool-call-parser deepseek_v4
      --enable-auto-tool-choice
      --limit-mm-per-prompt '{"image":8,"video":0}'
      --disable-uvicorn-access-log
      --disable-log-requests
      --otlp-traces-endpoint otel-collector:4317
      --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"medium"}'
    command: []
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://vllm:30000
      --backend vllm
      --policy cache_aware
      --api-key '${VLLM_API_KEY:?set VLLM_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    ports:
    - 127.0.0.1:30001:30001
    depends_on:
      otel-collector:
        condition: service_started
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:?set external OTLP gRPC endpoint}
      OTLP_UPSTREAM_INSECURE: 'false'
      ENGINE_METRICS_TARGET: vllm:30000
      ENGINE_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      TELEMETRY_RECIPE: deepseek-v4-flash-vision-hgx-h200-lmcache
      TELEMETRY_ENVIRONMENT: production
volumes:
  kernel-cache: null
