services:
  smg:
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://gemma4-mtp:30000
      --backend vllm
      --policy cache_aware
      --api-key '${VLLM_API_KEY:?set VLLM_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
  otel-collector:
    environment:
      ENGINE_METRICS_TARGET: gemma4-mtp:30000
