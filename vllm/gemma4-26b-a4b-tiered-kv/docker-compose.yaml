name: gemma4-a4b-vllm
x-gemma-common: &id001
  deploy:
    resources:
      reservations:
        devices:
        - capabilities:
          - gpu
          driver: nvidia
          count: 1
    placement: {}
  environment:
    HF_HUB_DISABLE_TELEMETRY: '1'
    HF_HUB_OFFLINE: '1'
    NVIDIA_VISIBLE_DEVICES: '0'
    OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
    OTEL_BSP_MAX_QUEUE_SIZE: '2048'
    OTEL_BSP_SCHEDULE_DELAY: '1000'
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    OTEL_SERVICE_NAME: vllm
    OTEL_TRACES_SAMPLER: parentbased_always_on
    PYTHONHASHSEED: '0'
    TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
    TRANSFORMERS_OFFLINE: '1'
    VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
    VLLM_CACHE_ROOT: /cache/vllm
    VLLM_ENABLE_CUDA_COMPATIBILITY: '1'
    VLLM_SERVED_MODEL: gemma4-26b-a4b
    VLLM_USE_V2_MODEL_RUNNER: '1'
  healthcheck:
    test:
    - CMD
    - python3
    - -c
    - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:30000/health',headers={'Authorization':'Bearer '+os.environ['VLLM_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
    interval: 30s
    timeout: 10s
    retries: 60
    start_period: 10m
  image: vllm/vllm-openai:v0.26.0-cu129@sha256:976b4ba10e247dbe5c5ce3e2ba952a359ef641ee25c3d091811c1bec420e5a23
  init: true
  ipc: private
  restart: unless-stopped
  shm_size: 144gb
  stop_grace_period: 2m0s
  ulimits:
    memlock:
      soft: -1
      hard: -1
  depends_on:
    otel-collector:
      condition: service_started
services:
  gemma4:
    <<: *id001
    volumes:
    - /data/models/gemma-4-26B-A4B-it:/models:ro
    - /data/vllm-cache:/cache
    - ./results:/bench-results
    - ./bench-serve-matrix.sh:/opt/gemma4/bench-serve-matrix.sh:ro
    - ./serve.sh:/opt/gemma4/serve.sh:ro
    - ./summarize-bench.py:/opt/gemma4/summarize-bench.py:ro
    entrypoint: >-
      /opt/gemma4/serve.sh
      --model /models
      --served-model-name gemma4-26b-a4b
      --host 0.0.0.0
      --port 30000
      --dtype bfloat16
      --tensor-parallel-size 1
      --attention-backend TRITON_ATTN
      --max-model-len 131072
      --max-num-seqs 24
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.90
      --async-scheduling
      --performance-mode throughput
      --enable-prefix-caching
      --enable-chunked-prefill
      --mm-processor-kwargs '{"max_soft_tokens":1120}'
      --limit-mm-per-prompt '{"image":4,"video":0,"audio":0}'
      --mm-processor-cache-gb 4
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --chat-template /models/chat_template.jinja
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{"enable_thinking":true}'
      --generation-config vllm
      --enable-prompt-tokens-details
      --enable-request-id-headers
      --disable-log-requests
      --otlp-traces-endpoint otel-collector:4317
    command: []
  gemma4-mtp:
    <<: *id001
    volumes:
    - /data/models/gemma-4-26B-A4B-it:/models:ro
    - /data/models/gemma-4-26B-A4B-it-assistant:/assistant-model:ro
    - /data/vllm-cache:/cache
    - ./results:/bench-results
    - ./bench-serve-matrix.sh:/opt/gemma4/bench-serve-matrix.sh:ro
    - ./serve.sh:/opt/gemma4/serve.sh:ro
    - ./summarize-bench.py:/opt/gemma4/summarize-bench.py:ro
    entrypoint: >-
      /opt/gemma4/serve.sh
      --model /models
      --served-model-name gemma4-26b-a4b
      --host 0.0.0.0
      --port 30000
      --dtype bfloat16
      --tensor-parallel-size 1
      --attention-backend TRITON_ATTN
      --max-model-len 131072
      --max-num-seqs 24
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.90
      --async-scheduling
      --performance-mode throughput
      --enable-prefix-caching
      --enable-chunked-prefill
      --mm-processor-kwargs '{"max_soft_tokens":1120}'
      --limit-mm-per-prompt '{"image":4,"video":0,"audio":0}'
      --mm-processor-cache-gb 4
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --chat-template /models/chat_template.jinja
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{"enable_thinking":true}'
      --generation-config vllm
      --enable-prompt-tokens-details
      --enable-request-id-headers
      --speculative-config '{"method":"mtp","model":"/assistant-model","num_speculative_tokens":4}'
      --disable-log-requests
      --otlp-traces-endpoint otel-collector:4317
    command: []
    profiles:
    - mtp
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://gemma4:30000
      --backend vllm
      --policy cache_aware
      --api-key '${VLLM_API_KEY:?set VLLM_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    ports:
    - 127.0.0.1:30001:30001
    depends_on:
      otel-collector:
        condition: service_started
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: jaeger:4317
      OTLP_UPSTREAM_INSECURE: 'true'
      ENGINE_METRICS_TARGET: gemma4:30000
      ENGINE_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      TELEMETRY_RECIPE: gemma4-26b-a4b-tiered-kv
      TELEMETRY_ENVIRONMENT: development
  jaeger:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: jaeger
