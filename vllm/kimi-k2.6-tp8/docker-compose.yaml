name: kimi-k2.6-tp8
services:
  vllm:
    cap_add:
    - SYS_NICE
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            driver: nvidia
            count: all
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      NCCL_CUMEM_ENABLE: '1'
      NCCL_NVLS_ENABLE: '1'
      OMP_NUM_THREADS: '32'
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '256'
      OTEL_BSP_MAX_QUEUE_SIZE: '2048'
      OTEL_BSP_SCHEDULE_DELAY: '1000'
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
      OTEL_SERVICE_NAME: vllm
      OTEL_TRACES_SAMPLER: parentbased_always_on
      TOKENIZERS_PARALLELISM: 'false'
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      VLLM_CACHE_ROOT: /cache/vllm
      VLLM_CONFIG_ROOT: /cache/vllm-config
      PYTHONHASHSEED: '0'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:30000/health',headers={'Authorization':'Bearer '+os.environ['VLLM_API_KEY']}); urllib.request.urlopen(r,timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m
    image: vllm/vllm-openai:v0.26.0-cu129@sha256:976b4ba10e247dbe5c5ce3e2ba952a359ef641ee25c3d091811c1bec420e5a23
    ipc: private
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 100m
    restart: unless-stopped
    shm_size: 116gb
    stop_grace_period: 1m0s
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
    - /models:/models
    - ./logs:/logs
    - ./cache/huggingface:/cache/huggingface
    - ./cache/vllm:/cache/vllm
    - ./cache/vllm-config:/cache/vllm-config
    - ./cache/torchinductor:/cache/torchinductor
    - ./cache/triton:/cache/triton
    - ../../misc/telemetry/vllm-serve.sh:/opt/recipe/serve.sh:ro
    depends_on:
      otel-collector:
        condition: service_started
    entrypoint: >-
      /opt/recipe/serve.sh /models/moonshotai/Kimi-K2.6
      --served-model-name kimi
      --host 0.0.0.0
      --port 30000
      --api-key '${VLLM_API_KEY:?set VLLM_API_KEY}'
      --trust-remote-code
      --reasoning-parser kimi_k2
      --tool-call-parser kimi_k2
      --enable-auto-tool-choice
      --max-model-len 202752
      --kv-cache-dtype fp8
      --block-size 64
      --gpu-memory-utilization 0.88
      --tensor-parallel-size 8
      --decode-context-parallel-size 8
      --mm-encoder-tp-mode data
      --attention-config.use_trtllm_ragged_deepseek_prefill True
      --performance-mode throughput
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-num-batched-tokens 65536
      --max-num-seqs 128
      --max-num-partial-prefills 4
      --max-long-partial-prefills 1
      --long-prefill-token-threshold 8192
      --max-cudagraph-capture-size 16
      --max-parallel-loading-workers 8
      --renderer-num-workers 8
      --kv-cache-metrics
      --disable-log-stats
      --disable-access-log-for-endpoints /health,/metrics,/ping
      --disable-log-requests
      --otlp-traces-endpoint otel-collector:4317
      --default-chat-template-kwargs '{"thinking":true}'
    command: []
  smg:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: smg
    command: >-
      --host 0.0.0.0
      --port 30001
      --worker-urls http://vllm:30000
      --backend vllm
      --policy cache_aware
      --api-key '${VLLM_API_KEY:?set VLLM_API_KEY}'
      --history-backend none
      --enable-trace
      --otlp-traces-endpoint otel-collector:4317
      --prometheus-host 0.0.0.0
      --prometheus-port 9234
      --health-check-endpoint /health
      --worker-startup-timeout-secs 1800
      --request-timeout-secs 1800
    ports:
    - 127.0.0.1:30001:30001
    depends_on:
      otel-collector:
        condition: service_started
  otel-collector:
    extends:
      file: ../../misc/telemetry/compose.services.yaml
      service: otel-collector
    environment:
      OTLP_UPSTREAM_ENDPOINT: ${OTLP_UPSTREAM_ENDPOINT:?set external OTLP gRPC endpoint}
      OTLP_UPSTREAM_INSECURE: 'false'
      ENGINE_METRICS_TARGET: vllm:30000
      ENGINE_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      TELEMETRY_RECIPE: kimi-k2.6-tp8
      TELEMETRY_ENVIRONMENT: production
